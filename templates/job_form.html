{% extends "base.html" %}
{% block title %}نشر وظيفة{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container"><h4 class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary"></i> نشر وظيفة جديدة</h4></div>
</div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">عنوان الوظيفة *</label>
                                <input type="text" name="title" class="form-control form-control-lg" required placeholder="مثال: مطور ويب خبير">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">عدد المناصب</label>
                                <input type="number" name="positions_count" class="form-control" value="1" min="1">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">الولاية *</label>
                                <select name="wilaya" class="form-select" required>
                                    <option value="">اختر الولاية</option>
                                    {% for w in wilayas %}
                                    <option value="{{ w }}">{{ w }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">المدينة</label>
                                <input type="text" name="city" class="form-control" placeholder="الجزائر العاصمة">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">نوع العقد *</label>
                                <select name="contract_type" class="form-select" required>
                                    {% for c in contract_types %}
                                    <option value="{{ c }}">{{ c }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">التخصص</label>
                                <select name="category" class="form-select">
                                    <option value="">اختر التخصص</option>
                                    {% for c in categories %}
                                    <option value="{{ c }}">{{ c }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">المستوى الوظيفي</label>
                                <select name="experience_level" class="form-select">
                                    <option value="">اختر المستوى</option>
                                    {% for l in ['مبتدئ','Junior (1-3 سنوات)','Mid (3-5 سنوات)','Senior (5-10 سنوات)','خبير (+10 سنوات)'] %}
                                    <option>{{ l }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" name="is_urgent" id="urgent">
                                    <label class="form-check-label fw-bold text-danger" for="urgent"><i class="bi bi-exclamation-triangle"></i> وظيفة عاجلة</label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">الراتب الأدنى (دج)</label>
                                <input type="number" name="salary_min" class="form-control" step="1000" placeholder="30000">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">الراتب الأقصى (دج)</label>
                                <input type="number" name="salary_max" class="form-control" step="1000" placeholder="80000">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">وصف الوظيفة *</label>
                            <textarea name="description" class="form-control" rows="6" required placeholder="صف الوظيفة ومهامها بالتفصيل..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">المسؤوليات</label>
                            <textarea name="responsibilities" class="form-control" rows="4" placeholder="المسؤوليات الرئيسية للوظيفة..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">المتطلبات</label>
                            <textarea name="requirements" class="form-control" rows="4" placeholder="المؤهلات، الخبرة، المهارات المطلوبة..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">المميزات</label>
                            <textarea name="benefits" class="form-control" rows="3" placeholder="الراتب، التأمين، ساعات العمل..."></textarea>
                        </div>
                        <div class="alert alert-info d-flex align-items-center gap-2">
                            <i class="bi bi-wallet2"></i>
                            <span>سيتم خصم <strong>{{ job_price }} دج</strong> من محفظتك. رصيدك الحالي: <strong>{{ wallet_balance }} دج</strong></span>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-cloud-upload"></i> نشر الوظيفة</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
