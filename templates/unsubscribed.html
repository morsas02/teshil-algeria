<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسهيل — إلغاء الاشتراك</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#eef3fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,20,60,.12);max-width:460px;width:100%;padding:40px 32px;text-align:center}
.icon{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:#e8f8f1;display:flex;align-items:center;justify-content:center}
.icon svg{width:40px;height:40px;stroke:#00b36b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;color:#0f172a;margin-bottom:10px}
p{color:#64748b;font-size:14px;line-height:1.9}
.brand{margin-top:26px;font-size:13px;color:#94a3b8}
.brand b{color:#0036c6;font-size:16px}
</style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 12l2 2 4-4"/>
            <circle cx="12" cy="12" r="9"/>
        </svg>
    </div>
    <h1>تم إلغاء الاشتراك</h1>
    <p>لن تتلقى رسائل ترويجية من <b>تسهيل</b> بعد الآن. لن تستمر الرسائل المتعلقة بحسابك أو طلبات التوظيف (إن وُجدت).</p>
    <p style="margin-top:8px">إذا غيّرت رأيك لاحقاً، يمكنك التواصل معنا في أي وقت عبر الموقع.</p>
    <div class="brand"><b>تسهيل</b><br>منصة التوظيف الجزائرية الأولى</div>
</div>
</body>
</html>
