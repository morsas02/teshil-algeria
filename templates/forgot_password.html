{% extends "base.html" %}
{% block title %}نسيت كلمة المرور{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card p-4 text-center">
                <i class="bi bi-shield-lock" style="font-size:3rem;color:var(--primary);"></i>
                <h4 class="fw-bold mt-3">نسيت كلمة المرور؟</h4>
                <p style="color:var(--gray-500);font-size:0.9rem;">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>
                <form method="POST">
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control form-control-lg" required placeholder="البريد الإلكتروني">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">إرسال رابط إعادة التعيين</button>
                </form>
                <div class="mt-3">
                    <a href="/login" class="text-decoration-none">تذكرت كلمة المرور؟ تسجيل الدخول</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
