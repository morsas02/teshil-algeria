{% extends "base.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card p-4 text-center">
                <i class="bi bi-key" style="font-size:3rem;color:var(--primary);"></i>
                <h4 class="fw-bold mt-3">إعادة تعيين كلمة المرور</h4>
                <p style="color:var(--gray-500);font-size:0.9rem;">أدخل كلمة المرور الجديدة</p>
                <form method="POST">
                    <div class="mb-3">
                        <input type="password" name="password" class="form-control form-control-lg" required minlength="6" placeholder="كلمة المرور الجديدة">
                    </div>
                    <div class="mb-3">
                        <input type="password" name="confirm_password" class="form-control form-control-lg" required minlength="6" placeholder="تأكيد كلمة المرور">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">تغيير كلمة المرور</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
