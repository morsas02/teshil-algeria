services:
  - type: web
    name: teshil
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind :$PORT --workers 2 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: teshil-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: "https://teshil.onrender.com"
      - key: STORAGE_ROOT
        value: "/opt/render/project/storage"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        value: "morsizitouni132@gmail.com"
      - key: BREVO_SENDER_NAME
        value: "تسهيل"
    disk:
      name: storage
      mountPath: /opt/render/project/storage
      sizeGB: 1

databases:
  - name: teshil-db
    plan: free
    databaseName: teshil
    ipAllowList: []
